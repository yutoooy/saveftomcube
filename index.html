<body>
<main class="app">
<section class="panel left"><h1>救救<br>小人</h1><div class="sub">方块正在淹没他。消除砖块，坚持到第 48 块！</div><div class="label">生命</div><div class="heartline"><span class="heart">♥</span><div class="health" style="flex:1"><i id="hpbar"></i></div><b id="hp">100</b></div><div id="status" class="status">暂时安全</div><div class="label">救援进度</div><div class="stats"><div class="stat"><b id="remain">48</b><span>剩余方块</span></div></div><button id="restart" class="action" style="margin-top:13px">重新开始</button></section>
<section class="board-wrap" id="boardWrap"><canvas id="game"></canvas><canvas id="fx"></canvas><div id="bubble" class="bubble"></div><div id="flash"></div><div class="scan"></div><div id="overlay" class="overlay"><div><h2>救救小人</h2><button id="start" class="action">开始救援</button></div></div></section>
<section class="panel right"><div class="label" style="margin-top:0">下一个</div><div class="nextBox"><canvas id="next"></canvas></div><div class="label">操作</div><div class="keys"><span class="key">←</span><span class="key">→</span> 移动<br><span class="key">↑</span> 旋转<br><span class="key">↓</span> 加速<br><span class="key">空格</span> 直接落下<br><span class="key">M</span> 静音</div></section>
<div class="mobile" aria-label="手机触控操作"><button data-key="drop" aria-label="直接落下">落下</button><button data-key="rotate" aria-label="旋转">↻</button><button data-key="left" aria-label="左移">←</button><button data-key="right" aria-label="右移">→</button><button data-key="down" aria-label="加速下降">↓</button></div>
</main>
<section id="ending"><div class="hero"><div class="success-person"><div class="little"><i class="torso"></i><i class="head"></i><i class="hair"></i><i class="eye a"></i><i class="eye b"></i><i class="mouth"></i></div></div><div class="speech">谢谢你救了我！</div><button id="again" class="action again">再救一次</button></div><div class="crack"><div class="half l"></div><div class="half r"></div></div></section>

<section id="rulesModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="rulesTitle"><div class="rules-card"><h2 id="rulesTitle">游戏规则</h2><ul><li>消除砖块，坚持完成 48 个方块。</li><li>每 25 秒地面会上涨一行。</li><li>砖块完全挡住鼻子后会持续扣血。</li><li>消除整行可恢复少量生命。</li></ul><button id="rulesKnown" class="action">知道了</button></div></section>
<script>
(()=>{

let swipeStart=null;wrap.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){swipeStart={x:e.clientX,y:e.clientY,t:performance.now()};e.preventDefault()}},{passive:false});wrap.addEventListener('pointerup',e=>{if(!swipeStart)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y,dt=performance.now()-swipeStart.t;swipeStart=null;if(Math.abs(dx)<18&&Math.abs(dy)<18){rotate();return}if(Math.abs(dx)>Math.abs(dy)){move(dx>0?1:-1,0)}else if(dy>45){dt<260?hardDrop():move(0,1)}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){cancelAnimationFrame(raf);running=false;$('#overlay').innerHTML='<div><h2>救援暂停</h2><p>回到游戏后继续救援。</p><button id="start" class="action">继续</button></div>';$('#overlay').classList.remove('hidden');$('#start').onclick=start}});
reset();initRules();scheduleFit();addEventListener('load',scheduleFit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(scheduleFit);
})();
